<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MedConnect - Patient Portal</title>
  <link rel="stylesheet" href="static/css/style.css" />
</head>
<body>

  <div class="intro-screen">
    <h1 class="intro-title">MedConnect</h1>
    <p class="intro-tagline">Healthcare Made Simple & Accessible</p>
  </div>

  <main class="main-container">
    
    <div class="brand-header">
      <h2>MedConnect</h2>
      <p>Patient Portal Access</p>
    </div>

    <div class="card">
      
      <div class="tab-container">
        <button class="tab-btn active" id="tabLogin" onclick="switchTab('login')">Sign In</button>
        <button class="tab-btn" id="tabRegister" onclick="switchTab('register')">Create Account</button>
      </div>

      <form id="loginForm" class="form-section active" onsubmit="handleAuth(event, 'Login')">
        <div class="form-group">
          <label for="loginEmail">Email Address</label>
          <input type="email" id="loginEmail" placeholder="e.g. alex@example.com" required />
        </div>

        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" placeholder="••••••••" required />
        </div>

        <button type="submit" class="btn-submit">Login</button>
      </form>

      <form id="registerForm" class="form-section" onsubmit="handleAuth(event, 'Registration')">
        <div class="form-group">
          <label for="regName">Full Name</label>
          <input type="text" id="regName" placeholder="e.g. Alex Johnson" required />
        </div>

        <div class="form-group">
          <label for="regPhone">Contact Number</label>
          <input type="tel" id="regPhone" placeholder="e.g. +1 555-0192" required />
        </div>

        <div class="form-group">
          <label for="regEmail">Email Address</label>
          <input type="email" id="regEmail" placeholder="alex@example.com" required />
        </div>

        <div class="form-group">
          <label for="regPassword">Password</label>
          <input type="password" id="regPassword" minlength="6" placeholder="At least 6 characters" required />
        </div>

        <button type="submit" class="btn-submit">Register as Patient</button>
      </form>

    </div>
  </main>

  <script>
    // Tab Toggle Logic
    function switchTab(tab) {
      const loginTab = document.getElementById('tabLogin');
      const regTab = document.getElementById('tabRegister');
      const loginForm = document.getElementById('loginForm');
      const regForm = document.getElementById('registerForm');

      if (tab === 'login') {
        loginTab.classList.add('active');
        regTab.classList.remove('active');
        loginForm.classList.add('active');
        regForm.classList.remove('active');
      } else {
        regTab.classList.add('active');
        loginTab.classList.remove('active');
        regForm.classList.add('active');
        loginForm.classList.remove('active');
      }
    }

    // Form Action Handling
    function handleAuth(event, type) {
      event.preventDefault();
      alert(`${type} successful! Redirecting to Patient Dashboard...`);
    }
  </script>

</body>
</html>
